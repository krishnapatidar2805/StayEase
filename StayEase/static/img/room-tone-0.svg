<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <!-- Back Wall elements -->
  <!-- Window with glowing moon -->
  <rect x="250" y="45" width="80" height="75" rx="6" fill="#1a202c" stroke="#e2e8f0" stroke-width="1.5" />
  <line x1="290" y1="45" x2="290" y2="120" stroke="#e2e8f0" stroke-width="1" />
  <line x1="250" y1="82" x2="330" y2="82" stroke="#e2e8f0" stroke-width="1" />
  <!-- Moon -->
  <path d="M 305 60 A 8 8 0 0 1 310 72 A 8 8 0 1 0 305 60 Z" fill="#f6e05e" />

  <!-- Floor line -->
  <line x1="20" y1="205" x2="380" y2="205" stroke="#ffffff" stroke-width="2" opacity="0.6" />

  <!-- Nightstand -->
  <rect x="35" y="145" width="40" height="60" rx="3" fill="#8c52ff" stroke="#fff" stroke-width="1.5" />
  <!-- Drawers -->
  <line x1="35" y1="175" x2="75" y2="175" stroke="#fff" stroke-width="1" />
  <circle cx="55" cy="160" r="3" fill="#ecc94b" />
  <circle cx="55" cy="190" r="3" fill="#ecc94b" />

  <!-- Table Lamp with Glow -->
  <path d="M 47 145 L 63 145 M 55 145 L 55 130 M 42 130 L 68 130 L 60 110 L 50 110 Z" fill="#fc8181" stroke="#fff" stroke-width="1.5" />
  <circle cx="55" cy="120" r="18" fill="#f6e05e" opacity="0.25" filter="blur(2px)" />

  <!-- Bed Frame -->
  <rect x="85" y="140" width="235" height="65" rx="4" fill="#ed8936" stroke="#fff" stroke-width="2" />
  <rect x="85" y="95" width="12" height="50" rx="2" fill="#dd6b20" stroke="#fff" stroke-width="1.5" />
  
  <!-- Pillows -->
  <rect x="105" y="122" width="45" height="18" rx="4" fill="#faf6ee" stroke="#fff" stroke-width="1.5" />
  <rect x="160" y="122" width="45" height="18" rx="4" fill="#faf6ee" stroke="#fff" stroke-width="1.5" />

  <!-- Duvet / Blanket -->
  <path d="M 215 140 L 215 205 L 320 205 L 320 140 Z" fill="#4299e1" stroke="#fff" stroke-width="1.5" />
  <path d="M 215 152 L 320 152" stroke="#fff" stroke-width="1.5" />
</svg>
