<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <!-- Sky glow -->
    <radialGradient id="skyGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3182ce" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#319795" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1a202c" stop-opacity="0"/>
    </radialGradient>
    <!-- Gold sun/moon -->
    <linearGradient id="sunGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf089"/>
      <stop offset="50%" stop-color="#ecc94b"/>
      <stop offset="100%" stop-color="#d69e2e"/>
    </linearGradient>
    <!-- Hotel facade -->
    <linearGradient id="hotelFacade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b6cb0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a365d" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Palm leaf gradient -->
    <linearGradient id="leafGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48bb78"/>
      <stop offset="100%" stop-color="#22543d"/>
    </linearGradient>
    <!-- Pool gradient -->
    <linearGradient id="poolGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#319795" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4fd1c5" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Background sky glow -->
  <rect x="0" y="0" width="500" height="400" fill="url(#skyGlow)" rx="16"/>

  <!-- Stars -->
  <g fill="#fff" opacity="0.6">
    <circle cx="80" cy="60" r="1.5"/>
    <circle cx="160" cy="40" r="1"/>
    <circle cx="240" cy="80" r="2"/>
    <circle cx="340" cy="50" r="1.5"/>
    <circle cx="430" cy="70" r="1"/>
  </g>

  <!-- Big Gold Sun/Moon -->
  <circle cx="370" cy="110" r="45" fill="url(#sunGrad)"/>
  
  <!-- Clouds -->
  <path d="M 40 100 C 60 80, 100 80, 120 100 C 130 95, 150 95, 160 105 L 40 105 Z" fill="#e2e8f0" opacity="0.15"/>
  <path d="M 320 140 C 335 130, 360 130, 375 140 C 382 135, 395 135, 400 142 L 320 142 Z" fill="#e2e8f0" opacity="0.15"/>

  <!-- Hotel Building Base structure -->
  <rect x="130" y="90" width="240" height="240" rx="8" fill="url(#hotelFacade)" stroke="#4299e1" stroke-width="1.5"/>
  
  <!-- Left Side Wing (Architectural element) -->
  <rect x="90" y="150" width="40" height="180" rx="4" fill="#2c5282" fill-opacity="0.8" stroke="#3182ce" stroke-width="1"/>
  
  <!-- Windows - Glowing yellow and cool blue -->
  <g stroke="none">
    <!-- Row 1 -->
    <rect x="150" y="110" width="25" height="20" rx="2" fill="#faf089" opacity="0.95" />
    <rect x="190" y="110" width="25" height="20" rx="2" fill="#90cdf4" opacity="0.4" />
    <rect x="240" y="110" width="25" height="20" rx="2" fill="#90cdf4" opacity="0.4" />
    <rect x="280" y="110" width="25" height="20" rx="2" fill="#faf089" opacity="0.9" />
    <rect x="320" y="110" width="25" height="20" rx="2" fill="#90cdf4" opacity="0.4" />

    <!-- Row 2 -->
    <rect x="150" y="150" width="25" height="20" rx="2" fill="#90cdf4" opacity="0.4" />
    <rect x="190" y="150" width="25" height="20" rx="2" fill="#faf089" opacity="0.95" />
    <rect x="240" y="150" width="25" height="20" rx="2" fill="#90cdf4" opacity="0.4" />
    <rect x="280" y="150" width="25" height="20" rx="2" fill="#90cdf4" opacity="0.4" />
    <rect x="320" y="150" width="25" height="20" rx="2" fill="#faf089" opacity="0.9" />

    <!-- Row 3 -->
    <rect x="150" y="190" width="25" height="20" rx="2" fill="#90cdf4" opacity="0.4" />
    <rect x="190" y="190" width="25" height="20" rx="2" fill="#90cdf4" opacity="0.4" />
    <rect x="240" y="190" width="25" height="20" rx="2" fill="#faf089" opacity="0.95" />
    <rect x="280" y="190" width="25" height="20" rx="2" fill="#faf089" opacity="0.9" />
    <rect x="320" y="190" width="25" height="20" rx="2" fill="#90cdf4" opacity="0.4" />
    
    <!-- Wing Windows -->
    <rect x="100" y="170" width="20" height="15" rx="1.5" fill="#faf089" opacity="0.8" />
    <rect x="100" y="200" width="20" height="15" rx="1.5" fill="#90cdf4" opacity="0.4" />
    <rect x="100" y="230" width="20" height="15" rx="1.5" fill="#faf089" opacity="0.85" />
  </g>

  <!-- Modern Entrance Canopy -->
  <path d="M 210 260 L 290 260 L 310 275 L 190 275 Z" fill="#ed8936" opacity="0.9"/>
  <rect x="220" y="275" width="60" height="55" fill="#2d3748" stroke="#e2e8f0" stroke-width="1.5"/>
  <path d="M 240 330 L 240 295 A 10 10 0 0 1 260 295 L 260 330" stroke="#ecc94b" stroke-width="2" fill="none"/>

  <!-- Left Palm Tree -->
  <path d="M 60 330 C 65 290, 75 250, 85 220" stroke="#744210" stroke-width="6" stroke-linecap="round" fill="none"/>
  <g fill="url(#leafGrad)">
    <path d="M 85 220 Q 60 200 35 210 Q 65 215 85 220 Z"/>
    <path d="M 85 220 Q 80 180 60 175 Q 75 195 85 220 Z"/>
    <path d="M 85 220 Q 110 180 120 185 Q 105 200 85 220 Z"/>
    <path d="M 85 220 Q 120 215 125 230 Q 105 225 85 220 Z"/>
  </g>

  <!-- Swimming Pool at Front -->
  <ellipse cx="250" cy="355" rx="190" ry="30" fill="url(#poolGrad)" stroke="#81e6d9" stroke-width="2"/>
  <path d="M 90 355 C 150 365, 350 365, 410 355" stroke="#fff" stroke-width="1.5" fill="none" opacity="0.5"/>
  
  <!-- Lounge chairs by the pool -->
  <path d="M 360 340 L 390 340 L 395 330" stroke="#fff" stroke-width="2" fill="none"/>
  <path d="M 370 340 L 375 330" stroke="#fff" stroke-width="1.5" fill="none"/>

  <!-- Front Garden Grass Lines -->
  <line x1="20" y1="330" x2="480" y2="330" stroke="#48bb78" stroke-width="3"/>
</svg>
