  <!-- Deluxe Bed -->
  <rect x="50" y="130" width="200" height="75" rx="5" fill="#4a5568" stroke="#fff" stroke-width="2" />
  <rect x="50" y="85" width="12" height="50" rx="2" fill="#2d3748" stroke="#fff" stroke-width="1.5" />
  
  <!-- Deluxe Pillows -->
  <rect x="75" y="112" width="50" height="18" rx="3" fill="#edf2f7" stroke="#fff" stroke-width="1.5" />
  <rect x="135" y="112" width="50" height="18" rx="3" fill="#edf2f7" stroke="#fff" stroke-width="1.5" />
  <rect x="90" y="122" width="30" height="10" rx="2" fill="#ecc94b" stroke="#fff" stroke-width="1" />
  <rect x="150" y="122" width="30" height="10" rx="2" fill="#ecc94b" stroke="#fff" stroke-width="1" />

  <!-- Blanket -->
  <path d="M 175 130 L 175 205 L 250 205 L 250 130 Z" fill="#38a169" stroke="#fff" stroke-width="1.5" />
  <path d="M 175 142 L 250 142" stroke="#fff" stroke-width="1.5" />

  <!-- Cozy Armchair on the right -->
  <!-- Chair body -->
