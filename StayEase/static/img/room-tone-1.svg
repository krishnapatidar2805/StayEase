  <!-- Arm rests -->
  <rect x="275" y="165" width="20" height="35" rx="4" fill="#dd6b20" stroke="#fff" stroke-width="1.5" />
  <rect x="345" y="165" width="20" height="35" rx="4" fill="#dd6b20" stroke="#fff" stroke-width="1.5" />
  <!-- Pillow on chair -->
