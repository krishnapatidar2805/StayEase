<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <!-- Floor line -->
  <line x1="20" y1="205" x2="380" y2="205" stroke="#ffffff" stroke-width="2" opacity="0.6" />

  <!-- Bed on the left -->
  <rect x="40" y="140" width="160" height="65" rx="4" fill="#2d3748" stroke="#fff" stroke-width="2" />
  <rect x="40" y="105" width="10" height="40" rx="2" fill="#1a202c" stroke="#fff" stroke-width="1.5" />
  <rect x="58" y="125" width="45" height="16" rx="2" fill="#fff" stroke="#fff" stroke-width="1.5" />
  <rect x="108" y="125" width="45" height="16" rx="2" fill="#fff" stroke="#fff" stroke-width="1.5" />
  <!-- Duvet -->
  <path d="M 125 140 L 125 205 L 200 205 L 200 140 Z" fill="#d69e2e" stroke="#fff" stroke-width="1.5" />
  <path d="M 125 150 L 200 150" stroke="#fff" stroke-width="1.5" />

  <!-- Workspace Desk on the right -->
  <!-- Legs -->
  <line x1="260" y1="150" x2="260" y2="205" stroke="#718096" stroke-width="3" />
  <line x1="340" y1="150" x2="340" y2="205" stroke="#718096" stroke-width="3" />
  <!-- Desk top -->
  <rect x="245" y="140" width="110" height="10" rx="2" fill="#744210" stroke="#fff" stroke-width="1.5" />
  
  <!-- Desk Chair -->
  <path d="M 280 205 L 280 170 L 305 170 L 305 205 Z" fill="#319795" stroke="#fff" stroke-width="1.5" />
  <rect x="282" y="152" width="21" height="20" rx="3" fill="#234e52" stroke="#fff" stroke-width="1.5" />

  <!-- Laptop on Desk -->
  <path d="M 285 140 L 305 140 L 312 130 L 292 130 Z" fill="#e2e8f0" stroke="#fff" stroke-width="1.5" />
  <polygon points="293,130 307,130 304,118 296,118" fill="#ebf8ff" stroke="#fff" stroke-width="1" />

  <!-- Premium Desk Lamp -->
  <path d="M 328 140 L 328 120 A 10 10 0 0 0 318 110" fill="none" stroke="#ecc94b" stroke-width="2" />
  <path d="M 312 110 L 324 110 L 320 102 L 316 102 Z" fill="#e53e3e" stroke="#fff" stroke-width="1" />
  <!-- Glow -->
  <circle cx="318" cy="115" r="10" fill="#faf089" opacity="0.3" filter="blur(2px)" />
</svg>
