<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <!-- Sunset background outside balcony -->
  <defs>
    <linearGradient id="sunsetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fc8181" />
      <stop offset="60%" stop-color="#f6ad55" />
      <stop offset="100%" stop-color="#f6e05e" />
    </linearGradient>
  </defs>

  <!-- Balcony glass door background -->
  <rect x="270" y="45" width="90" height="160" rx="4" fill="url(#sunsetGrad)" stroke="#fff" stroke-width="2" />
  <line x1="315" y1="45" x2="315" y2="205" stroke="#fff" stroke-width="1.5" />
  <!-- Stars outside balcony -->
  <circle cx="290" cy="65" r="1.5" fill="#fff" />
  <circle cx="340" cy="55" r="1" fill="#fff" />
  <circle cx="300" cy="85" r="1" fill="#fff" />

  <!-- Balcony Railing -->
  <line x1="270" y1="150" x2="360" y2="150" stroke="#fff" stroke-width="2" />
  <line x1="285" y1="150" x2="285" y2="205" stroke="#fff" stroke-width="1.5" />
  <line x1="305" y1="150" x2="305" y2="205" stroke="#fff" stroke-width="1.5" />
  <line x1="325" y1="150" x2="325" y2="205" stroke="#fff" stroke-width="1.5" />
  <line x1="345" y1="150" x2="345" y2="205" stroke="#fff" stroke-width="1.5" />

  <!-- Floor line -->
  <line x1="20" y1="205" x2="380" y2="205" stroke="#ffffff" stroke-width="2" opacity="0.6" />

  <!-- Honeymoon Bed -->
  <rect x="50" y="130" width="190" height="75" rx="5" fill="#c69a44" stroke="#fff" stroke-width="2" />
  <rect x="50" y="85" width="12" height="50" rx="2" fill="#744210" stroke="#fff" stroke-width="1.5" />
  
  <!-- Pillows -->
  <rect x="75" y="112" width="45" height="18" rx="3" fill="#fffdfa" stroke="#fff" stroke-width="1.5" />
  <rect x="130" y="112" width="45" height="18" rx="3" fill="#fffdfa" stroke="#fff" stroke-width="1.5" />

  <!-- Crimson Duvet -->
  <path d="M 155 130 L 155 205 L 240 205 L 240 130 Z" fill="#e53e3e" stroke="#fff" stroke-width="1.5" />
  <path d="M 155 142 L 240 142" stroke="#fff" stroke-width="1.5" />

  <!-- Pink Hearts above Bed -->
  <!-- Heart 1 -->
  <path d="M 115 65 C 115 60, 110 55, 105 55 C 100 55, 95 60, 95 65 C 95 75, 115 85, 115 85 C 115 85, 135 75, 135 65 C 135 60, 130 55, 125 55 C 120 55, 115 60, 115 65 Z" fill="#ec4899" stroke="#fff" stroke-width="1" />
  <!-- Heart 2 -->
  <path d="M 155 70 C 155 66, 151 62, 147 62 C 143 62, 140 66, 140 70 C 140 78, 155 86, 155 86 C 155 86, 170 78, 170 70 C 170 66, 166 62, 162 62 C 158 62, 155 66, 155 70 Z" fill="#f43f5e" stroke="#fff" stroke-width="0.8" opacity="0.8" />
</svg>
