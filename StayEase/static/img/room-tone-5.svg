<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <!-- Floor line -->
  <line x1="20" y1="205" x2="380" y2="205" stroke="#ffffff" stroke-width="2" opacity="0.6" />

  <!-- Luxury Chandelier at Top Center -->
  <!-- Chain -->
  <line x1="200" y1="10" x2="200" y2="40" stroke="#ecc94b" stroke-width="1.5" />
  <!-- Chandelier Frame -->
  <path d="M 175 40 L 225 40 M 165 50 C 180 50, 200 40, 200 40 C 200 40, 220 50, 235 50" stroke="#ecc94b" stroke-width="2" fill="none" />
  <!-- Crystals/Glows -->
  <circle cx="170" cy="52" r="4" fill="#faf089" stroke="#fff" stroke-width="0.5" />
  <circle cx="200" cy="55" r="4" fill="#faf089" stroke="#fff" stroke-width="0.5" />
  <circle cx="230" cy="52" r="4" fill="#faf089" stroke="#fff" stroke-width="0.5" />
  <!-- Glow area -->
  <ellipse cx="200" cy="50" rx="35" ry="12" fill="#fff" opacity="0.2" filter="blur(3px)" />

  <!-- Presidential Poster Bed -->
  <!-- Back Headboard -->
  <rect x="100" y="115" width="200" height="25" rx="3" fill="#2d3748" stroke="#fff" stroke-width="1.5" />
  <!-- Bed Base -->
  <rect x="100" y="140" width="200" height="65" rx="4" fill="#1a202c" stroke="#fff" stroke-width="2" />
  
  <!-- Wooden poster pillars in gold -->
  <line x1="95" y1="205" x2="95" y2="65" stroke="#ecc94b" stroke-width="3" />
  <line x1="305" y1="205" x2="305" y2="65" stroke="#ecc94b" stroke-width="3" />
  <line x1="95" y1="65" x2="305" y2="65" stroke="#ecc94b" stroke-width="2.5" stroke-dasharray="8,2" />
  
  <!-- Pillows -->
  <rect x="115" y="122" width="50" height="18" rx="3" fill="#edf2f7" stroke="#fff" stroke-width="1" />
  <rect x="175" y="122" width="50" height="18" rx="3" fill="#edf2f7" stroke="#fff" stroke-width="1" />
  <rect x="235" y="122" width="50" height="18" rx="3" fill="#edf2f7" stroke="#fff" stroke-width="1" />

  <!-- Royal Purple Duvet -->
  <path d="M 215 140 L 215 205 L 300 205 L 300 140 Z" fill="#6b46c1" stroke="#fff" stroke-width="1.5" />
  <path d="M 215 152 L 300 152" stroke="#fff" stroke-width="1.5" />

  <!-- Luxury Plant on Left -->
  <!-- Pot -->
  <rect x="40" y="170" width="22" height="35" rx="2" fill="#ed8936" stroke="#fff" stroke-width="1.5" />
  <!-- Plant Leaves -->
  <path d="M 51 170 Q 30 150 40 135 M 51 170 Q 70 150 60 135 M 51 170 Q 51 130 51 120" stroke="#48bb78" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 51 170 Q 35 155 25 150 M 51 170 Q 65 155 75 150" stroke="#38a169" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
