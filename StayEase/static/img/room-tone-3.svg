  <rect x="230" y="145" width="130" height="60" rx="4" fill="#4a5568" stroke="#fff" stroke-width="2" />
  <rect x="352" y="110" width="8" height="40" rx="2" fill="#2d3748" stroke="#fff" stroke-width="1.5" />
  <rect x="305" y="130" width="40" height="16" rx="2" fill="#faf6ee" stroke="#fff" stroke-width="1.5" />
