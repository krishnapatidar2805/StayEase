  <rect x="40" y="110" width="8" height="40" rx="2" fill="#2d3748" stroke="#fff" stroke-width="1.5" />
  <rect x="55" y="130" width="40" height="16" rx="2" fill="#faf6ee" stroke="#fff" stroke-width="1.5" />
  <!-- Blanket 1 -->
  <path d="M 105 145 L 105 205 L 170 205 L 170 145 Z" fill="#9f7aea" stroke="#fff" stroke-width="1.5" />
  <path d="M 105 153 L 170 153" stroke="#fff" stroke-width="1.5" />

