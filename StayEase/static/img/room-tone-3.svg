  <circle cx="200" cy="180" r="3.5" fill="#faf089" />

  <!-- Table Lamp -->
  <path d="M 195 155 L 205 155 M 200 155 L 200 142 M 190 142 L 210 142 L 205 125 L 195 125 Z" fill="#e53e3e" stroke="#fff" stroke-width="1.5" />
  <!-- Lamp Glow -->
