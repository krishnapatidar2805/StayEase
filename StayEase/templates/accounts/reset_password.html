{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card">
    <div class="panel">
      <p class="eyebrow">Almost there</p>
      <h2>Reset your password</h2>
      <div class="divider-gold"></div>
      <form method="post">
        {% csrf_token %}
        <label class="form-label">OTP</label>{{ form.otp }}
        <div style="margin-top:12px;"><label class="form-label">New Password</label>{{ form.new_password }}</div>
        <button type="submit" class="btn btn-gold btn-block" style="margin-top:16px;">Reset Password</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
