{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card">
    <div class="panel">
      <p class="eyebrow">Account recovery</p>
      <h2>Forgot your password?</h2>
      <div class="divider-gold"></div>
      <form method="post">
        {% csrf_token %}
        <label class="form-label">Email</label>{{ form.email }}
        <button type="submit" class="btn btn-gold btn-block" style="margin-top:16px;">Send Reset OTP</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
