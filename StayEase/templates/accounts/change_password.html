{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card">
    <div class="panel">
      <h2>Change password</h2>
      <div class="divider-gold"></div>
      <form method="post">
        {% csrf_token %}
        <label class="form-label">Old Password</label>
        <input class="form-control" type="password" name="old_password" required>
        <div style="margin-top:12px;"><label class="form-label">New Password</label>
        <input class="form-control" type="password" name="new_password" required></div>
        <button type="submit" class="btn btn-gold btn-block" style="margin-top:16px;">Update Password</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
