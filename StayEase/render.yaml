services:
  - type: web
    name: stayease
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn stayease_project.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: stayease-db
          property: connectionString
    autoDeploy: true

databases:
  - name: stayease-db
    databaseName: stayease
    user: stayease_user
    plan: free
